<body data-page="staking">
<div id="hdr"></div>
<main>
<section class="first">
  <div class="wrap">
    <span class="kicker">Validator &middot; Staking</span>
    <h1 style="font-size:clamp(2.2rem,4.6vw,3.4rem)">Who stakes with SoLyrae</h1>
    <p class="lead" style="margin:16px 0 0"><span class="live"><i></i><span>Loading&hellip;</span></span></p>
    <div class="tiles" id="st-tiles"><p class="note">Loading&hellip;</p></div>

    <h2 style="margin-top:64px;font-size:1.8rem">Stake movements</h2>
    <div class="two-charts">
      <div class="card"><h3>Net stake change per epoch (SOL)</h3><div id="ch-changes"></div></div>
      <div class="card"><h3>Active stake per epoch (SOL)</h3><div id="ch-stakers"></div></div>
    </div>
    <div class="tbl-wrap" id="st-hist" style="margin-top:20px"></div>

    <h2 style="margin-top:64px;font-size:1.8rem">Where the stake comes from</h2>
    <div class="card" style="margin-top:22px"><div id="st-kinds"></div></div>
    <div class="tbl-wrap" id="st-sources" style="margin-top:20px"></div>
    <h2 style="margin-top:64px;font-size:1.8rem">Stake sizes</h2>
    <div class="two">
      <div class="card"><h3>Stakers by stake size</h3><div id="ch-sizes"></div></div>
      <div class="tbl-wrap" id="st-sizes" style="margin-top:0"></div>
    </div>

    <h2 style="margin-top:64px;font-size:1.8rem">Next epoch</h2>
    <div class="two-charts">
      <div class="card"><h3>Stake entering</h3><div id="ne-in" class="chart-body" style="padding:6px 0 0"></div></div>
      <div class="card"><h3>Stake leaving</h3><div id="ne-out" class="chart-body" style="padding:6px 0 0"></div></div>
    </div>
  </div>
</section>
</main>
<div id="ftr"></div>
<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Validator details"></aside>
