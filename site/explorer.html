<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solana validator explorer · SoLyrae</title>
<meta name="description" content="Search, filter and compare every Solana validator: stake, commission, APY, skip rate, vote success, client, provider and country. Live data.">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="canonical" href="https://www.solyrae.com/explorer.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SoLyrae">
<meta property="og:title" content="Solana validator explorer · SoLyrae">
<meta property="og:description" content="Search, filter and compare every Solana validator: stake, commission, APY, skip rate, vote success, client, provider and country. Live data.">
<meta property="og:url" content="https://www.solyrae.com/explorer.html">
<meta property="og:image" content="https://www.solyrae.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@SoLyrae_Solana">
</head>
<body data-page="explorer">
<div id="hdr"></div>
<main>
<section class="first" style="padding-bottom:40px">
  <div class="wrap">
    <span class="kicker">Validator explorer</span>
    <h1 style="font-size:clamp(2.2rem,4.6vw,3.4rem)">Who secures Solana, and what they pay stakers</h1>
    <p style="margin:16px 0 0"><span class="live"><i></i><span>Loading&hellip;</span></span></p>    <div class="strip" style="margin-top:28px">
      <div><div class="lbl">Active validators</div><div class="val sk" data-k="n_val">000</div></div>
      <div><div class="lbl">Total stake</div><div class="val sk" data-k="n_stake">000M</div></div>
      <div><div class="lbl">Stake-weighted APY</div><div class="val sk" data-k="n_apy">0.00%</div><div class="sub">10-epoch median per validator</div></div>
      <div><div class="lbl">Nakamoto coefficient</div><div class="val sk" data-k="n_nak">00</div><div class="sub" data-k="n_nak_sub">validators holding over 1/3 of stake</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="validators" aria-selected="true">Validators</button>
      <button role="tab" data-tab="providers" aria-selected="false">Providers</button>
      <button role="tab" data-tab="countries" aria-selected="false">Countries</button>
      <button role="tab" data-tab="clients" aria-selected="false">Clients</button>
    </div>
    <div class="toolbar" id="v-tools">
      <input type="search" id="q" placeholder="Search by name or vote account" aria-label="Search validators">
      <button class="pill" data-f="all" aria-pressed="true">All</button>
      <button class="pill" data-f="zero" aria-pressed="false">0% commission</button>
      <button class="pill" data-f="jito0" aria-pressed="false">0% Jito commission</button>
      <button class="pill" data-f="apy" aria-pressed="false">APY above median</button>
    </div>
    <div id="ex-out"><div id="ex-body"><p class="note" style="padding:20px">Loading live data&hellip;</p></div></div>
  </div>
</section>
</main>
<div id="ftr"></div>
<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Validator details"></aside>
<script src="app.js"></script>
</body>
</html>
