name: Beacon

# Rebuilds the security bulletin (alerts and feeds) every 3 hours and saves the result in the repository,
# which makes the hosting service publish the new version by itself.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Beacon data and feeds
        run: python tools/build_beacon.py
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "beacon-bot"
          git config user.email "beacon-bot@users.noreply.github.com"
          git add site/data site/feeds
          git diff --staged --quiet || (git commit -m "Beacon update" && git push)
